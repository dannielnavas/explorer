[package]
name = "explorer"
version = "0.1.0"
edition = "2021"
description = "Explorador de archivos de alto rendimiento en Rust para GNOME (CachyOS)"
license = "GPL-3.0-or-later"

[lib]
name = "explorer"
path = "src/lib.rs"

[[bin]]
name = "explorer"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
dirs = "6"
gtk4 = { version = "0.9", features = ["v4_12"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
md5 = "0.7"
notify = "8"
nucleo-matcher = "0.3"
relm4 = { version = "0.9", features = ["macros", "libadwaita"] }
serde = { version = "1", features = ["derive"] }
sysinfo = "0.33"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "macros", "time"] }
toml = "0.8"
trash = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
all = "warn"
perf = "warn"
